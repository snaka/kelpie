name: Kelpie
options:
  bundleIdPrefix: com.snaka
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

packages:
  Kelpie:
    path: .

targets:
  Kelpie:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Kelpie
    dependencies:
      - package: Kelpie
        product: KelpieCore
      - package: Kelpie
        product: KelpieClient
    info:
      path: Sources/Kelpie/Info.plist
      properties:
        CFBundleName: Kelpie
        CFBundleDisplayName: Kelpie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 snaka. MIT Licensed."
        NSHighResolutionCapable: true
    entitlements:
      path: Sources/Kelpie/Kelpie.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snaka.kelpie
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
