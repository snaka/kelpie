<!--
  Kelpie's app icon artwork.

  Adapted from "Dog Silhouette" by GangandInfographie, from Openclipart
  (https://openclipart.org/detail/276049/dog-silhouette), released into the
  public domain under CC0.

  Two things differ from the original, both about the hindquarters:

  1. The original carries its tail up and over the back, tip forward of a
     vertical line through the root, which the Australian Kelpie standard rules
     out ("under no circumstances should the tail be carried past a vertical
     line drawn through the root"). The tail here is a SEPARATE closed subpath,
     wound the same way as the body: a nonzero fill unions the two, so where it
     crosses the hind leg the overlap fills solid instead of cancelling to a
     hole, which is what happens when a tail is spliced into the body's own
     outline.

  2. The original's croup detoured up into that tail. With the tail gone from
     the outline it left a peak on the rump, so the croup was redrawn as one
     cubic running from the end of the topline straight to the top of the
     thigh, its handles along the tangents either side so both joins stay
     smooth.

  The viewBox is trimmed to the paths so the rasterised PNG has no margin —
  scripts/make-icon.swift fits the artwork by aspect ratio alone.
-->
